version: '3.8'

services:
  archmcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archmcp-server
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - AUTH_ENABLED=true
      - AUTH_TOKENS=dev-token-secret-123,employee-key-abc
      - REPOSITORIES_FILE=data/repositories.yaml
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
